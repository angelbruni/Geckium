firstTimeAboutTitle=Vybrať O programe
firstTimeAboutText=Zdá sa, že toto je prvýkrát, čo spúšťate O programe v Geckium.\nChcete priradiť toto tlačidlo na zfalšovaný dialóg {{brandingName}}?\n\nZrušenie ho nastaví na spustenie dialógu {{browserName}}. Ak stlačíte OK, dialóg O programe {{browserName}} stále nájdete v ponuke:\nPanel ponúk -> Pomocník -> O programe {{browserName}}\n\nToto nastavenie môžete zmeniť v:\nNastavenia Geckium -> Správanie
