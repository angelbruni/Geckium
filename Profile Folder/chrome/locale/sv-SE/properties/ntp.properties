# Incognito
# Chrome 1
youHaveGoneIncognito=<html:strong>Du surfar nu inkognito</html:strong>. Sidor som du visar i det här fönstret visas inte i webbläsarens historik eller sökhistorik, och de lämnar inga andra spår, t.ex. cookies, på datorn när du har stängt inkognitofönstret. Filer som du hämtar och bokmärken som du skapar sparas dock.
goingIncognito=Att surfa inkognito påverkar inte hur andra personer, servrar eller program beter sig. Se upp för:
websitesThatCollectInformation=Webbplatser som samlar in eller delar information om dig
internetServiceProvidersOrEmployers=Internetleverantörer eller arbetsgivare som spårar vilka sidor du besöker
maliciousSoftwareThatTracks=Skadlig programvara som registrerar dina tangenttryckningar i utbyte mot gratis smileys
surveillanceBySecretAgents=Övervakning av hemliga agenter
peopleStandingBehindYou=Personer som står bakom dig
learnMoreAboutIncognitoBrowsing=<html:a href="http://www.google.com/support/chrome/bin/answer.py?answer=95464&amp;">Läs mer</html:a> om att surfa inkognito.

# Chrome 4
becauseGoogleChromeDoesNotControl=<html:span>Eftersom %s inte kan styra hur tillägg hanterar dina personuppgifter har alla tillägg inaktiverats i inkognitofönster. Du kan aktivera dem igen ett i taget i </html:span><html:a href="about:addons">tilläggshanteraren</html:a>.

# Chrome 37
youHaveGoneIncognito37=Du surfar inkognito.
pagesYouViewInIncognito=Sidor som visas på flikar i inkognitoläget försvinner från webbhistoriken, från dina cookies och från sökhistoriken när <html:strong>alla</html:strong> inkognitoflikar har stängts. Alla filer som du hämtar eller bokmärken som du skapar sparas. <html:a href="https://support.google.com/chrome/?p=incognito">Läs mer om gästsessioner i inkognitoläge</html:a>
goingIncognitoDoesNotHideYourBrowsing=Inkognitoläget döljer inte webbhistoriken för din arbetsgivare, din internetleverantör eller webbplatserna du besöker.

