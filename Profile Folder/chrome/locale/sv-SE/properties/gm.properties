firstTimeAboutTitle=Välj Om
firstTimeAboutText=Det verkar som att det här är första gången du öppnar Om i Geckium.\nVill du koppla den här knappen till den imiterade dialogrutan för {{brandingName}}?\n\nOm du avbryter öppnar knappen dialogrutan för {{browserName}} i stället. Om du klickar på OK kan du fortfarande öppna dialogrutan Om {{browserName}} via:\nMenyfältet -> Hjälp -> Om {{browserName}}\n\nDu kan ändra den här inställningen under:\nGeckium-inställningar -> Beteende